---
# DevHive project profile
# This file is the single source of truth for project metadata, stack,
# commands and agent configuration. It is consumed by the renderer at
# scripts/render-devhive-templates.mjs to instantiate generic templates.
devhive_version: "2.2.0"

project:
  id: cutternest
  name: "CutterNest"
  mcp_name: "workspace-cutternest-kit"
  description: "Sistema autocontenido de optimización de cortes para fabricación de muebles (MDF, melamina, madera) con visualización 2D/3D, cotización local, inventario de sobrantes y autenticación TOTP + Guest PIN."
  workspace_path: /workspace/cutternest-kit
  repo_root: .
  owner: CutterNest Open Source
  contact: maintainer@cutternest.example

stack:
  languages:
    - python
    - typescript
  backend:
    framework: FastAPI
    runtime: Python
    version: "3.11"
    language: Python
    test_framework: pytest
    entry: backend/app/main.py
  frontend:
    framework: React
    bundler: Vite
    version: "18"
    language: TypeScript
    test_framework: vitest
    path: frontend
  database:
    engine: SQLite
    version: "3"
    init_path: init.sql
    schema_file: init.sql
  cache:
    engine: none
  package_manager: pip / pnpm
  container_orchestrator: docker-compose
  compose_files:
    core: docker-compose.yml
    fase2: docker-compose.fase2.yml
    fase4: docker-compose.fase4.yml
  reverse_proxy: nginx

paths:
  agents: .agents
  devhive: .devhive
  backend_src: backend/app
  frontend_src: frontend/src
  infra_docker: ""
  tests: backend/tests
  scripts: scripts
  docs: ""
  config: backend/app
  middleware: backend/app
  services: backend/app
  routes: backend/app/routers
  utils: backend/app
  types: frontend/src/types
  frontend_services: frontend/src/api
  frontend_components: frontend/src/components
  certs: certs
  data: data
  nginx: frontend/nginx.conf
  guardian_scripts: .agents/guardian/scripts
  tunnel_scripts: scripts
  ldap_data: data

services:
  backend:
    host: backend
    port: 8000
  frontend:
    host: frontend
    port: 80
  whatsapp_gateway:
    host: whatsapp-gateway
    port: 3000
  postgres:
    host: postgres
    port: 5432
  redis:
    host: cache
    port: 6379

commands:
  install: pnpm install
  install_backend: cd backend && pip install -r requirements.txt
  install_frontend: cd frontend && pnpm install
  test_backend: cd backend && pytest
  test_frontend: cd frontend && pnpm test
  test_assembly_planner: cd frontend/public/assembly-planner && node --test "js/**/*.test.js" "js/*.test.js"
  test_docker: docker compose up -d --build && docker exec cutternest-backend pytest
  build_backend: cd backend && echo "no build step for Python backend"
  build_frontend: cd frontend && pnpm build
  typecheck_backend: cd backend && echo "no typecheck step for Python backend"
  typecheck_frontend: cd frontend && pnpm run typecheck
  audit_backend: cd backend && echo "no audit step for Python backend"
  dev_backend: cd backend && uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
  dev_frontend: cd frontend && pnpm dev
  docker_up: docker compose up -d --build --remove-orphans
  docker_up_fase2: docker compose -f docker-compose.yml -f docker-compose.fase2.yml up -d --build --remove-orphans
  docker_up_fase4: docker compose -f docker-compose.yml -f docker-compose.fase2.yml -f docker-compose.fase4.yml up -d --build --remove-orphans
  docker_down: docker compose down
  validate_devhive: node scripts/validate-devhive.mjs
  validate_devhive_full: node scripts/validate-devhive-full.mjs
  optimize: node scripts/optimize.mjs
  checkpoint: node scripts/checkpoint.mjs
  resume: node scripts/resume.mjs

agents:
  enabled:
    - architect
    - backend-agent
    - frontend-agent
    - assembly-planner-agent
    - db-agent
    - auth-agent
    - deploy-agent
    - test-agent
    - docs-agent
    - knowledge-graph-agent
  plugins:
    - code-reviewer
    - dependency-checker
    - integration-validator
    - ui-ux-agent

security:
  auth_methods:
    - local
    - totp
    - backup_codes
    - guest_pin
  sensitive_env_keys:
    - JWT_SECRET_KEY
    - TOTP_ENCRYPTION_KEY
    - DATABASE_URL
  cookie_policy: httpOnly
  min_bcrypt_rounds: 10
  blocked_paths:
    - ".env*"
    - "certs/*.key"
    - "certs/ca.key"
  blocked_commands:
    - "rm -rf /"
    - "DROP DATABASE"
    - "docker system prune"
    - "chmod -R 777 /"
  blocked_actions:
    - "modify .env files"
    - "read private keys"
    - "modify guardian SKILL.md"
    - "modify policies.json"

devhive:
  profile: .devhive/profile.yaml
  schema: .devhive/profile.schema.json
  project_brief: .devhive/project-brief.md
  conventions: .devhive/conventions.md
  current_sprint: .devhive/current-sprint.md
  decisions: .devhive/decisions/*.md
  architecture: .devhive/architecture.md
  security_policy: .devhive/security-policy.md
  domain_rules: .devhive/domain-rules.md
  conventions_core: .devhive/conventions-core.md
  conventions_backend: .devhive/conventions-backend.md
  conventions_frontend: .devhive/conventions-frontend.md
  conventions_db: .devhive/conventions-db.md
  conventions_deploy: .devhive/conventions-deploy.md
  conventions_test: .devhive/conventions-test.md
  conventions_auth: .devhive/conventions-auth.md
  conventions_agents: .devhive/conventions-agents.md
  sprint_archive: .devhive/sprints/archive/*.md

knowledge_graph:
  enabled: true
  agent: knowledge-graph-agent
  memory_dir: .agents/knowledge-graph-agent/memory
  queries: .agents/knowledge-graph-agent/memory/queries.md
  queries_cold: .agents/knowledge-graph-agent/memory/queries.cold.md
  edges: .agents/knowledge-graph-agent/memory/edges.md
  nodes_dir: .agents/knowledge-graph-agent/memory/graph/

guardian:
  policies: .agents/guardian/policies.json
  skill: .agents/guardian/SKILL.md
  deliverable_template: .agents/guardian/templates/deliverable-template.md
  audit_log: .agents/guardian/audit.log
  queue: .agents/guardian/memory/queue.md
  active_tasks: .agents/guardian/memory/active-tasks.md

# Skeleton used when rendering .agents/templates/agent-skill.md.hbs.
# Replace {agent_id} with the concrete agent name when creating a new agent.
agent:
  id: "{agent_id}"
  name: "{agent_id}"
  role: "Specialized DevHive Agent"
  description: "Responsible for {agent_id} tasks in {{project.name}}."
  scope: "TBD"
  skill_path: "{{paths.agents}}/{agent_id}/SKILL.md"
  active_tasks_path: "{{paths.agents}}/{agent_id}/memory/active-tasks.md"
  completed_tasks_path: "{{paths.agents}}/{agent_id}/memory/completed-tasks.md"
  queue_path: "{{paths.agents}}/{agent_id}/memory/queue.md"

# Variable convention for templates:
# Use {{project.name}}, {{project.workspace_path}}, {{stack.backend.framework}},
# {{commands.test_backend}}, etc. Dot notation walks nested objects.
# Top-level keys like {{devhive_version}} are also available.
