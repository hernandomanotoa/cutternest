services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: cutternest-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    environment:
      - DATABASE_URL=sqlite:///data/cutternest.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-Lax}
      - JWT_ACCESS_EXPIRE_MINUTES=15
      - JWT_REFRESH_EXPIRE_DAYS=7
      - GUEST_SESSION_HOURS=4
      - OFFCUT_THRESHOLD_CM=30
      - KERF_MM=3
      - MARGEN_MM=2
    networks:
      - cutternest-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: cutternest-frontend
    env_file:
      - .env
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./data/frontend-vite-cache:/app/node_modules/.vite
    networks:
      - cutternest-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  cutternest-network:
    driver: bridge
