<svg viewBox="0 0 750 650" xmlns="http://www.w3.org/2000/svg" style="background:#0f172a;width:100%;height:auto;display:block;">
  <text x="375.0" y="30" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="700" font-family="system-ui,sans-serif">DESPIECE — Cajón M21</text>
  <text x="375.0" y="50" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui,sans-serif">Frente + Laterales + Fondo + Base + Tirador</text>

  <!-- FRENTE (arriba) -->
  <g transform="translate(170.0, 75)">
    <rect x="0" y="0" width="410" height="180" rx="4" fill="#C19A6B" stroke="white" stroke-width="2"/>
    <text x="205.0" y="95.0" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="700">FRENTEx</text>
    <text x="205.0" y="112.0" text-anchor="middle" fill="#cbd5e1" font-size="9">410 × 180 × 15</text>
    <rect x="185.0" y="-10" width="40" height="8" rx="2" fill="#A0A0A0" stroke="white" stroke-width="1"/>
  </g>

  <!-- LATERAL IZQ -->
  <g transform="translate(50, 260)">
    <rect x="0" y="0" width="180" height="450" rx="4" fill="#D9C2A3" stroke="white" stroke-width="2"/>
    <text x="90.0" y="225.0" text-anchor="middle" fill="#0f172a" font-size="10" font-weight="700" writing-mode="tb">LAT IZQ</text>
    <text x="90.0" y="255.0" text-anchor="middle" fill="#0f172a" font-size="8" writing-mode="tb">180×450</text>
  </g>

  <!-- LATERAL DER -->
  <g transform="translate(520, 260)">
    <rect x="0" y="0" width="180" height="450" rx="4" fill="#D9C2A3" stroke="white" stroke-width="2"/>
    <text x="90.0" y="225.0" text-anchor="middle" fill="#0f172a" font-size="10" font-weight="700" writing-mode="tb">LAT DER</text>
    <text x="90.0" y="255.0" text-anchor="middle" fill="#0f172a" font-size="8" writing-mode="tb">180×450</text>
  </g>

  <!-- BASE -->
  <g transform="translate(190.0, 320)">
    <rect x="0" y="0" width="370" height="450" rx="4" fill="#D9C2A3" stroke="white" stroke-width="2"/>
    <text x="185.0" y="229.0" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">BASE</text>
    <text x="185.0" y="245.0" text-anchor="middle" fill="#0f172a" font-size="9">370 × 450 × 15</text>
  </g>

  <!-- FONDO (detrás, dashed) -->
  <g transform="translate(210.0, 340)">
    <rect x="0" y="0" width="370" height="450" rx="4" fill="#F2F2F2" stroke="white" stroke-width="2" stroke-dasharray="6 3" opacity="0.85"/>
    <text x="185.0" y="229.0" text-anchor="middle" fill="#64748b" font-size="10" font-weight="700">FONDO</text>
    <text x="185.0" y="243.0" text-anchor="middle" fill="#64748b" font-size="8">370 × 450 (sin cantos)</text>
  </g>

  <!-- Líneas de explosión -->
  <line x1="375.0" y1="260" x2="375.0" y2="310" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 3"/>
  <line x1="235" y1="485.0" x2="185.0" y2="545.0" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 3"/>
  <line x1="515" y1="485.0" x2="565.0" y2="545.0" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 3"/>

  <!-- Instrucciones -->
  <g transform="translate(520, 260)">
    <rect x="0" y="0" width="180" height="120" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="90" y="18" text-anchor="middle" fill="#f1f5f9" font-size="10" font-weight="700">ENSAMBLAJE</text>
    <text x="8" y="38" fill="#94a3b8" font-size="9">1. Unir laterales a base</text>
    <text x="8" y="55" fill="#94a3b8" font-size="9">2. Colocar fondo (encajado)</text>
    <text x="8" y="72" fill="#94a3b8" font-size="9">3. Atornillar frente</text>
    <text x="8" y="89" fill="#94a3b8" font-size="9">4. Instalar tirador</text>
    <text x="90" y="108" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="700">Espesor: 15 mm</text>
  </g>
</svg>