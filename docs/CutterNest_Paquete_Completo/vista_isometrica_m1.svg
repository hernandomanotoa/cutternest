<svg viewBox="0 0 700 600" xmlns="http://www.w3.org/2000/svg" style="background:#0f172a;width:100%;height:auto;display:block;">
  <defs>
    <linearGradient id="gradSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C19A6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5A2B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <text x="350" y="35" text-anchor="middle" fill="#f1f5f9" font-size="18" font-weight="700" font-family="system-ui,sans-serif">VISTA ISOMÉTRICA — Módulo 1</text>
  <text x="350" y="58" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui,sans-serif">Proyección 3D simplificada | 450 × 520 × 2300 mm</text>

  <!-- Proyección isométrica: factor 0.5 para profundidad -->
  <g transform="translate(200, 120)">
    <!-- Cara frontal (más brillante) -->
    <polygon points="0,0 180,0 180,460 0,460" fill="#C19A6B" stroke="white" stroke-width="2"/>
    <text x="90" y="240" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">FRONTAL</text>
    <text x="90" y="260" text-anchor="middle" fill="#0f172a" font-size="9">450 × 2300</text>

    <!-- Cara superior (perspectiva) -->
    <polygon points="0,0 180,0 240,-40 60,-40" fill="#D9C2A3" stroke="white" stroke-width="2"/>
    <text x="140" y="-15" text-anchor="middle" fill="#0f172a" font-size="9" font-weight="700">SUPERIOR</text>

    <!-- Cara lateral derecha (más oscura) -->
    <polygon points="180,0 240,-40 240,420 180,460" fill="#8B5A2B" stroke="white" stroke-width="2"/>
    <text x="215" y="230" text-anchor="middle" fill="#f1f5f9" font-size="9" font-weight="700" writing-mode="tb">LATERAL</text>

    <!-- Cajón sobresaliendo -->
    <polygon points="10,80 170,80 170,160 10,160" fill="#8B5A2B" stroke="white" stroke-width="1.5" opacity="0.95"/>
    <polygon points="10,80 40,65 200,65 170,80" fill="#A0522D" stroke="white" stroke-width="1" opacity="0.9"/>
    <polygon points="170,80 200,65 200,145 170,160" fill="#6B3A1F" stroke="white" stroke-width="1" opacity="0.9"/>
    <text x="90" y="125" text-anchor="middle" fill="#f1f5f9" font-size="9" font-weight="700">CAJÓN</text>

    <!-- Cajón inferior -->
    <polygon points="10,320 170,320 170,400 10,400" fill="#8B5A2B" stroke="white" stroke-width="1.5" opacity="0.95"/>
    <text x="90" y="365" text-anchor="middle" fill="#f1f5f9" font-size="9" font-weight="700">CAJÓN</text>

    <!-- Repisas (líneas horizontales) -->
    <line x1="0" y1="60" x2="180" y2="60" stroke="white" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="440" x2="180" y2="440" stroke="white" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- Leyenda de ejes -->
  <g transform="translate(480, 150)">
    <rect x="0" y="0" width="180" height="140" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="90" y="22" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="700">EJES 3D</text>
    <line x1="20" y1="45" x2="60" y2="45" stroke="#ef4444" stroke-width="3"/><text x="70" y="50" fill="#ef4444" font-size="10" font-weight="700">X = Ancho (450)</text>
    <line x1="20" y1="70" x2="60" y2="70" stroke="#3b82f6" stroke-width="3"/><text x="70" y="75" fill="#3b82f6" font-size="10" font-weight="700">Y = Prof. (520)</text>
    <line x1="20" y1="95" x2="60" y2="95" stroke="#22c55e" stroke-width="3"/><text x="70" y="100" fill="#22c55e" font-size="10" font-weight="700">Z = Alto (2300)</text>
    <text x="90" y="125" text-anchor="middle" fill="#94a3b8" font-size="9">Factor iso: 0.5</text>
  </g>

  <!-- Nota -->
  <text x="350" y="580" text-anchor="middle" fill="#64748b" font-size="10" font-family="monospace">Vista esquemática — no está a escala en profundidad</text>
</svg>