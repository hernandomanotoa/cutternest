<svg viewBox="0 0 2000 900" xmlns="http://www.w3.org/2000/svg" style="background:#0f172a; width:100%; height:95vh; display:block;">
  <defs>
    <pattern id="g50gl" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0L0 0 0 50" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="argl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="2000" height="900" fill="url(#g50gl)"/>

  <text x="1000" y="40" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700" font-family="system-ui,sans-serif">ESTRUCTURA GLOBAL — Librero Completo</text>
  <text x="1000" y="65" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif">1880 × 100 mm (zócalo) + 1880 × 40 mm (tapa) | 4 patas + 2 tirantes a pared</text>

  <g transform="translate(60, 100)">
    <!-- ZÓCALO CORRIDO -->
    <rect x="0" y="400" width="1880" height="100" rx="3" fill="#C19A6B" stroke="#1e293b" stroke-width="2"/>
    <text x="940" y="455" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="700">ZÓCALO CORRIDO 1880 × 100 × 15</text>

    <!-- TAPA CORRIDA -->
    <rect x="0" y="0" width="1880" height="40" rx="3" fill="#D9C2A3" stroke="#1e293b" stroke-width="2"/>
    <text x="940" y="25" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">TAPA CORRIDA 1880 × 40 × 30</text>

    <!-- PANEL POSTERIOR (línea punteada) -->
    <rect x="0" y="40" width="1880" height="360" fill="#F2F2F2" stroke="#334155" stroke-width="1" stroke-dasharray="6 4" opacity="0.7"/>
    <text x="940" y="230" text-anchor="middle" fill="#64748b" font-size="14" font-family="monospace">PANEL POSTERIOR 1880 × 2230 × 15</text>
    <text x="940" y="250" text-anchor="middle" fill="#64748b" font-size="10">(Vista trasera, no visible de frente)</text>

    <!-- MÓDULO 1 (izquierdo) -->
    <rect x="0" y="40" width="900" height="360" fill="none" stroke="#C19A6B" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="450" y="70" text-anchor="middle" fill="#C19A6B" font-size="11" font-weight="700">MÓDULO 1 — Cajonera (450 × 2300)</text>

    <!-- MÓDULO 2 (derecho) -->
    <rect x="900" y="40" width="910" height="360" fill="none" stroke="#8B5A2B" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="1355" y="70" text-anchor="middle" fill="#8B5A2B" font-size="11" font-weight="700">MÓDULO 2 — Librero (910 × 2230)</text>

    <!-- PATAS REGULABLES (4) -->
    <rect x="20" y="500" width="80" height="120" rx="3" fill="#A0A0A0" stroke="#1e293b" stroke-width="2"/>
    <text x="60" y="565" text-anchor="middle" fill="#0f172a" font-size="8" font-weight="700">PATA 1</text>

    <rect x="480" y="500" width="80" height="120" rx="3" fill="#A0A0A0" stroke="#1e293b" stroke-width="2"/>
    <text x="520" y="565" text-anchor="middle" fill="#0f172a" font-size="8" font-weight="700">PATA 2</text>

    <rect x="980" y="500" width="80" height="120" rx="3" fill="#A0A0A0" stroke="#1e293b" stroke-width="2"/>
    <text x="1020" y="565" text-anchor="middle" fill="#0f172a" font-size="8" font-weight="700">PATA 3</text>

    <rect x="1780" y="500" width="80" height="120" rx="3" fill="#A0A0A0" stroke="#1e293b" stroke-width="2"/>
    <text x="1820" y="565" text-anchor="middle" fill="#0f172a" font-size="8" font-weight="700">PATA 4</text>

    <!-- TIRANTES A PARED (2) -->
    <rect x="200" y="20" width="80" height="80" rx="3" fill="#A0A0A0" stroke="#1e293b" stroke-width="2"/>
    <text x="240" y="55" text-anchor="middle" fill="#0f172a" font-size="8" font-weight="700" writing-mode="tb">TIRANTE</text>
    <text x="240" y="85" text-anchor="middle" fill="#0f172a" font-size="7">80×80</text>

    <rect x="1600" y="20" width="80" height="80" rx="3" fill="#A0A0A0" stroke="#1e293b" stroke-width="2"/>
    <text x="1640" y="55" text-anchor="middle" fill="#0f172a" font-size="8" font-weight="700" writing-mode="tb">TIRANTE</text>
    <text x="1640" y="85" text-anchor="middle" fill="#0f172a" font-size="7">80×80</text>

    <!-- LÍNEAS DE ANCLAJE A PARED -->
    <line x1="240" y1="20" x2="240" y2="-30" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="240" y="-40" text-anchor="middle" fill="#ef4444" font-size="9" font-weight="700">ANCLAJE PARED</text>

    <line x1="1640" y1="20" x2="1640" y2="-30" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="1640" y="-40" text-anchor="middle" fill="#ef4444" font-size="9" font-weight="700">ANCLAJE PARED</text>

    <!-- DIMENSIONES -->
    <line x1="0" y1="660" x2="1880" y2="660" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#argl)" marker-start="url(#argl)"/>
    <text x="940" y="685" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="700">1880 mm (ancho total)</text>

    <line x1="-20" y1="0" x2="-20" y2="500" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#argl)" marker-start="url(#argl)"/>
    <text x="-38" y="250" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="700" writing-mode="tb">500 mm (profundidad)</text>
  </g>

  <!-- LEYENDA -->
  <g transform="translate(1700, 120)">
    <rect x="0" y="0" width="270" height="220" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="135" y="22" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="700">ESTRUCTURA GLOBAL</text>

    <rect x="10" y="35" width="20" height="12" rx="2" fill="#C19A6B"/><text x="36" y="45" fill="#cbd5e1" font-size="10">Zócalo (15mm)</text>
    <rect x="10" y="52" width="20" height="12" rx="2" fill="#D9C2A3"/><text x="36" y="62" fill="#cbd5e1" font-size="10">Tapa (30mm)</text>
    <rect x="10" y="69" width="20" height="12" rx="2" fill="#F2F2F2"/><text x="36" y="79" fill="#cbd5e1" font-size="10">Panel posterior</text>
    <rect x="10" y="86" width="20" height="12" rx="2" fill="#A0A0A0"/><text x="36" y="96" fill="#cbd5e1" font-size="10">Patas regulables</text>
    <rect x="10" y="103" width="20" height="12" rx="2" fill="#A0A0A0"/><text x="36" y="113" fill="#cbd5e1" font-size="10">Tirantes anclaje</text>

    <line x1="10" y1="130" x2="30" y2="130" stroke="#C19A6B" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="36" y="134" fill="#cbd5e1" font-size="9">Módulo 1 (cajonera)</text>
    <line x1="10" y1="145" x2="30" y2="145" stroke="#8B5A2B" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="36" y="149" fill="#cbd5e1" font-size="9">Módulo 2 (librero)</text>

    <text x="135" y="175" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="700">Total: 41 piezas</text>
    <text x="135" y="192" text-anchor="middle" fill="#94a3b8" font-size="9">5 piezas globales + 36 módulos</text>
  </g>
</svg>