<svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg" style="background:#0f172a; width:100%; height:95vh; display:block;">
  <defs>
    <pattern id="g50s" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0L0 0 0 50" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="ars" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="600" height="800" fill="url(#g50s)"/>

  <text x="300" y="35" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700" font-family="system-ui,sans-serif">MÓDULO 4 — Silla</text>
  <text x="300" y="58" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif">450 × 450 × 900 mm | Family: seating</text>

  <g transform="translate(75, 90)">
    <!-- RESPALDO -->
    <rect x="0" y="0" width="450" height="500" rx="3" fill="#C19A6B" stroke="#1e293b" stroke-width="2"/>
    <text x="225" y="260" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">RESPALDO 450×500</text>

    <!-- ASIENTO -->
    <rect x="0" y="500" width="450" height="50" rx="3" fill="#C19A6B" stroke="#1e293b" stroke-width="2"/>
    <text x="225" y="532" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">ASIENTO 450×50</text>

    <!-- PATAS FRONT -->
    <rect x="10" y="550" width="40" height="350" rx="2" fill="#8B5A2B" stroke="#1e293b" stroke-width="2"/>
    <text x="30" y="740" text-anchor="middle" fill="#f1f5f9" font-size="8" writing-mode="tb">PATA F-I</text>

    <rect x="400" y="550" width="40" height="350" rx="2" fill="#8B5A2B" stroke="#1e293b" stroke-width="2"/>
    <text x="420" y="740" text-anchor="middle" fill="#f1f5f9" font-size="8" writing-mode="tb">PATA F-D</text>

    <!-- PATAS BACK (más tenues) -->
    <rect x="10" y="550" width="40" height="350" rx="2" fill="#8B5A2B" stroke="#1e293b" stroke-width="2" opacity="0.6"/>
    <rect x="400" y="550" width="40" height="350" rx="2" fill="#8B5A2B" stroke="#1e293b" stroke-width="2" opacity="0.6"/>

    <!-- TRAVESANOS -->
    <rect x="50" y="700" width="350" height="30" rx="2" fill="#D9C2A3" stroke="#1e293b" stroke-width="1.5"/>
    <text x="225" y="720" text-anchor="middle" fill="#0f172a" font-size="8" font-weight="700">TRAVESANO FRONT</text>

    <rect x="50" y="750" width="350" height="30" rx="2" fill="#D9C2A3" stroke="#1e293b" stroke-width="1.5" opacity="0.6"/>
    <text x="225" y="770" text-anchor="middle" fill="#0f172a" font-size="8" font-weight="700">TRAVESANO BACK</text>

    <!-- DIMENSIONES -->
    <line x1="0" y1="920" x2="450" y2="920" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#ars)" marker-start="url(#ars)"/>
    <text x="225" y="945" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="700">450 mm</text>

    <line x1="-20" y1="0" x2="-20" y2="900" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#ars)" marker-start="url(#ars)"/>
    <text x="-38" y="450" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="700" writing-mode="tb">900 mm</text>
  </g>

  <!-- LEYENDA -->
  <g transform="translate(460, 110)">
    <rect x="0" y="0" width="120" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="60" y="22" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="700">ESTADOS</text>
    <rect x="10" y="35" width="16" height="10" rx="2" fill="#C19A6B" stroke="white" stroke-width="1.5"/>
    <text x="32" y="44" fill="#10b981" font-size="9" font-weight="700">● Ensamblada</text>
    <rect x="10" y="52" width="16" height="10" rx="2" fill="#8B5A2B" opacity="0.6" stroke="white" stroke-width="1"/>
    <text x="32" y="61" fill="#94a3b8" font-size="9">○ Pendiente</text>
    <text x="60" y="85" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="700">Family: seating</text>
    <text x="60" y="102" text-anchor="middle" fill="#94a3b8" font-size="8">Sin anti-pandeo</text>
  </g>
</svg>