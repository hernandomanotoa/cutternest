<svg viewBox="0 0 1400 2400" xmlns="http://www.w3.org/2000/svg" style="background:#0f172a; width:100%; height:95vh; display:block;">
  <defs>
    <pattern id="g50w" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0L0 0 0 50" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arw" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="1400" height="2400" fill="url(#g50w)"/>

  <text x="700" y="40" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700" font-family="system-ui,sans-serif">MÓDULO 5 — Ropero con Puertas</text>
  <text x="700" y="65" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif">1200 × 2200 mm | Family: wardrobe | 2 puertas abatibles</text>

  <g transform="translate(150, 100)">
    <!-- FONDO -->
    <rect x="0" y="0" width="1200" height="2200" fill="#F2F2F2" stroke="#334155" stroke-width="2" opacity="0.9"/>

    <!-- BASE -->
    <rect x="0" y="2185" width="1200" height="15" rx="2" fill="#C19A6B" stroke="#1e293b" stroke-width="2"/>
    <text x="600" y="2196" text-anchor="middle" fill="#0f172a" font-size="9" font-weight="700">BASE 1200×15</text>

    <!-- TAPA -->
    <rect x="0" y="0" width="1200" height="15" rx="2" fill="#C19A6B" stroke="#1e293b" stroke-width="2"/>
    <text x="600" y="11" text-anchor="middle" fill="#0f172a" font-size="9" font-weight="700">TAPA 1200×15</text>

    <!-- LATERALES -->
    <rect x="0" y="15" width="15" height="2170" rx="2" fill="#C19A6B" stroke="#1e293b" stroke-width="2"/>
    <text x="7.5" y="1100" text-anchor="middle" fill="#0f172a" font-size="8" font-weight="700" writing-mode="tb">LAT IZQ</text>

    <rect x="1185" y="15" width="15" height="2170" rx="2" fill="#C19A6B" stroke="#1e293b" stroke-width="2"/>
    <text x="1192.5" y="1100" text-anchor="middle" fill="#0f172a" font-size="8" font-weight="700" writing-mode="tb">LAT DER</text>

    <!-- RIEL COLGADOR -->
    <rect x="50" y="200" width="1100" height="15" rx="2" fill="#A0A0A0" stroke="#1e293b" stroke-width="1.5"/>
    <text x="600" y="212" text-anchor="middle" fill="#0f172a" font-size="9" font-weight="700">RIEL COLGADOR 1100×15</text>

    <!-- ESTANTE -->
    <rect x="50" y="600" width="1100" height="20" rx="2" fill="#D9C2A3" stroke="#1e293b" stroke-width="2"/>
    <text x="600" y="615" text-anchor="middle" fill="#0f172a" font-size="10" font-weight="700">ESTANTE 1100×20</text>

    <!-- ANTI-PANDEO: Estante 1100mm > 800mm límite -->
    <!-- Divisor central para el estante -->
    <rect x="590" y="600" width="20" height="20" rx="2" fill="#D9C2A3" stroke="#1e293b" stroke-width="1.5"/>
    <text x="600" y="640" text-anchor="middle" fill="#f59e0b" font-size="8" font-weight="700">SOPORTE CENTRAL</text>

    <!-- PUERTA IZQUIERDA -->
    <rect x="15" y="15" width="585" height="2170" rx="3" fill="#D9C2A3" stroke="#1e293b" stroke-width="2" opacity="0.9"/>
    <text x="307" y="1100" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="700">PUERTA IZQUIERDA</text>
    <text x="307" y="1125" text-anchor="middle" fill="#0f172a" font-size="10">590 × 2180 mm</text>
    <!-- Tirador puerta izq -->
    <rect x="560" y="1000" width="8" height="80" rx="2" fill="#A0A0A0" stroke="#1e293b" stroke-width="1"/>

    <!-- PUERTA DERECHA -->
    <rect x="600" y="15" width="585" height="2170" rx="3" fill="#D9C2A3" stroke="#1e293b" stroke-width="2" opacity="0.9"/>
    <text x="892" y="1100" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="700">PUERTA DERECHA</text>
    <text x="892" y="1125" text-anchor="middle" fill="#0f172a" font-size="10">590 × 2180 mm</text>
    <!-- Tirador puerta der -->
    <rect x="632" y="1000" width="8" height="80" rx="2" fill="#A0A0A0" stroke="#1e293b" stroke-width="1"/>

    <!-- DIMENSIONES -->
    <line x1="0" y1="2230" x2="1200" y2="2230" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arw)" marker-start="url(#arw)"/>
    <text x="600" y="2255" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="700">1200 mm</text>

    <line x1="-30" y1="0" x2="-30" y2="2200" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arw)" marker-start="url(#arw)"/>
    <text x="-48" y="1100" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="700" writing-mode="tb">2200 mm</text>
  </g>

  <!-- LEYENDA -->
  <g transform="translate(1250, 120)">
    <rect x="0" y="0" width="130" height="200" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="65" y="22" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="700">ESTADOS</text>
    <rect x="10" y="35" width="18" height="12" rx="2" fill="#C19A6B" stroke="white" stroke-width="1.5"/>
    <text x="34" y="45" fill="#10b981" font-size="10" font-weight="700">● Ensamblada</text>
    <rect x="10" y="55" width="18" height="12" rx="2" fill="#D9C2A3" stroke="#4ECDC4" stroke-width="2"/>
    <text x="34" y="65" fill="#4ECDC4" font-size="10" font-weight="700">● Paso actual</text>
    <rect x="10" y="75" width="18" height="12" rx="2" fill="#D9C2A3" opacity="0.5" stroke="white" stroke-width="1"/>
    <text x="34" y="85" fill="#94a3b8" font-size="10">○ Pendiente</text>
    <text x="65" y="110" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="700">Anti-pandeo</text>
    <text x="65" y="128" text-anchor="middle" fill="#94a3b8" font-size="8">Estante 1100 &gt; 800</text>
    <text x="65" y="144" text-anchor="middle" fill="#10b981" font-size="8">✓ Soporte central</text>
    <text x="65" y="162" text-anchor="middle" fill="#94a3b8" font-size="8">Riel colgador</text>
    <text x="65" y="180" text-anchor="middle" fill="#94a3b8" font-size="8">2 puertas abatibles</text>
  </g>
</svg>