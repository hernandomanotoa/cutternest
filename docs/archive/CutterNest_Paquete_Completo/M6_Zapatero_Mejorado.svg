<svg viewBox="0 0 1000 1500" xmlns="http://www.w3.org/2000/svg" style="background:#0f172a; width:100%; height:95vh; display:block;">
  <defs>
    <pattern id="g50z" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0L0 0 0 50" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arz" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="1000" height="1500" fill="url(#g50z)"/>

  <text x="500" y="40" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700" font-family="system-ui,sans-serif">MÓDULO 6 — Zapatero</text>
  <text x="500" y="65" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif">800 × 300 × 1200 mm | Family: cabinet | 4 repisas inclinadas</text>

  <g transform="translate(100, 100)">
    <!-- FONDO -->
    <rect x="0" y="0" width="800" height="1200" fill="#F2F2F2" stroke="#334155" stroke-width="2" opacity="0.9"/>

    <!-- BASE -->
    <rect x="0" y="1185" width="800" height="15" rx="2" fill="#8B5A2B" stroke="#1e293b" stroke-width="2"/>
    <text x="400" y="1196" text-anchor="middle" fill="#f1f5f9" font-size="9" font-weight="700">BASE 800×15</text>

    <!-- TAPA -->
    <rect x="0" y="0" width="800" height="15" rx="2" fill="#8B5A2B" stroke="#1e293b" stroke-width="2"/>
    <text x="400" y="11" text-anchor="middle" fill="#f1f5f9" font-size="9" font-weight="700">TAPA 800×15</text>

    <!-- LATERALES -->
    <rect x="0" y="15" width="15" height="1170" rx="2" fill="#8B5A2B" stroke="#1e293b" stroke-width="2"/>
    <text x="7.5" y="600" text-anchor="middle" fill="#f1f5f9" font-size="8" font-weight="700" writing-mode="tb">LAT IZQ</text>

    <rect x="785" y="15" width="15" height="1170" rx="2" fill="#8B5A2B" stroke="#1e293b" stroke-width="2"/>
    <text x="792.5" y="600" text-anchor="middle" fill="#f1f5f9" font-size="8" font-weight="700" writing-mode="tb">LAT DER</text>

    <!-- REPISAS INCLINADAS (4 niveles) -->
    <!-- Repisa 1 (superior) -->
    <rect x="30" y="100" width="740" height="20" rx="2" fill="#D9C2A3" stroke="#1e293b" stroke-width="2" transform="rotate(-15, 400, 110)"/>
    <text x="400" y="95" text-anchor="middle" fill="#0f172a" font-size="9" font-weight="700">REPISA 1 (inclinada)</text>

    <!-- Repisa 2 -->
    <rect x="30" y="350" width="740" height="20" rx="2" fill="#D9C2A3" stroke="#1e293b" stroke-width="2" transform="rotate(-15, 400, 360)"/>
    <text x="400" y="345" text-anchor="middle" fill="#0f172a" font-size="9" font-weight="700">REPISA 2 (inclinada)</text>

    <!-- Repisa 3 -->
    <rect x="30" y="600" width="740" height="20" rx="2" fill="#D9C2A3" stroke="#1e293b" stroke-width="2" transform="rotate(-15, 400, 610)"/>
    <text x="400" y="595" text-anchor="middle" fill="#0f172a" font-size="9" font-weight="700">REPISA 3 (inclinada)</text>

    <!-- Repisa 4 (inferior) -->
    <rect x="30" y="850" width="740" height="20" rx="2" fill="#D9C2A3" stroke="#1e293b" stroke-width="2" transform="rotate(-15, 400, 860)"/>
    <text x="400" y="845" text-anchor="middle" fill="#0f172a" font-size="9" font-weight="700">REPISA 4 (inclinada)</text>

    <!-- ANTI-PANDEO: Repisas 740mm < 800mm límite, OK sin soporte extra -->
    <!-- Pero agregamos soportes frontales pequeños -->
    <rect x="200" y="120" width="20" height="80" rx="2" fill="#8B5A2B" stroke="#1e293b" stroke-width="1"/>
    <rect x="400" y="120" width="20" height="80" rx="2" fill="#8B5A2B" stroke="#1e293b" stroke-width="1"/>
    <rect x="600" y="120" width="20" height="80" rx="2" fill="#8B5A2B" stroke="#1e293b" stroke-width="1"/>

    <!-- DIMENSIONES -->
    <line x1="0" y1="1230" x2="800" y2="1230" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arz)" marker-start="url(#arz)"/>
    <text x="400" y="1255" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="700">800 mm</text>

    <line x1="-25" y1="0" x2="-25" y2="1200" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arz)" marker-start="url(#arz)"/>
    <text x="-42" y="600" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="700" writing-mode="tb">1200 mm</text>
  </g>

  <!-- LEYENDA -->
  <g transform="translate(920, 120)">
    <rect x="0" y="0" width="130" height="160" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="65" y="22" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="700">ESTADOS</text>
    <rect x="10" y="35" width="18" height="12" rx="2" fill="#8B5A2B" stroke="white" stroke-width="1.5"/>
    <text x="34" y="45" fill="#10b981" font-size="10" font-weight="700">● Ensamblada</text>
    <rect x="10" y="55" width="18" height="12" rx="2" fill="#D9C2A3" stroke="#4ECDC4" stroke-width="2"/>
    <text x="34" y="65" fill="#4ECDC4" font-size="10" font-weight="700">● Paso actual</text>
    <rect x="10" y="75" width="18" height="12" rx="2" fill="#D9C2A3" opacity="0.5" stroke="white" stroke-width="1"/>
    <text x="34" y="85" fill="#94a3b8" font-size="10">○ Pendiente</text>
    <text x="65" y="110" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="700">Anti-pandeo</text>
    <text x="65" y="128" text-anchor="middle" fill="#94a3b8" font-size="8">Repisa 740 &lt; 800</text>
    <text x="65" y="144" text-anchor="middle" fill="#10b981" font-size="8">✓ Sin soporte extra</text>
  </g>
</svg>