<svg viewBox="0 0 900 3200" xmlns="http://www.w3.org/2000/svg" style="background:#0f172a;width:100%;height:auto;display:block;">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker>
  </defs>

  <text x="450" y="40" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700" font-family="system-ui,sans-serif">PASOS DE ENSAMBLAJE — Módulo 1</text>
  <text x="450" y="65" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif">Secuencia recomendada de montaje (6 pasos)</text>

  <!-- PASO 1: Base -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="700" height="420" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" fill="#f59e0b" font-size="14" font-weight="700">PASO 1: Colocar la Base</text>
    <rect x="200" y="80" width="300" height="40" rx="3" fill="#C19A6B" stroke="white" stroke-width="2"/>
    <text x="350" y="107" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">BASE 450 × 520 × 15</text>
    <text x="350" y="150" text-anchor="middle" fill="#94a3b8" font-size="10">Verificar nivel con burbuja. Patas regulables al piso.</text>
    <text x="350" y="170" text-anchor="middle" fill="#64748b" font-size="9">Herramienta: destornillador, nivel</text>
  </g>

  <!-- Flecha -->
  <line x1="450" y1="530" x2="450" y2="560" stroke="#f59e0b" stroke-width="2" marker-end="url(#a)"/>

  <!-- PASO 2: Laterales -->
  <g transform="translate(100, 580)">
    <rect x="0" y="0" width="700" height="420" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" fill="#f59e0b" font-size="14" font-weight="700">PASO 2: Encajar Laterales</text>
    <rect x="200" y="80" width="300" height="40" rx="3" fill="#C19A6B" stroke="white" stroke-width="2" opacity="0.4"/>
    <rect x="200" y="80" width="20" height="300" rx="3" fill="#C19A6B" stroke="white" stroke-width="2"/>
    <rect x="480" y="80" width="20" height="300" rx="3" fill="#C19A6B" stroke="white" stroke-width="2"/>
    <text x="350" y="220" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">LATERALES 15 × 2300</text>
    <text x="350" y="260" text-anchor="middle" fill="#94a3b8" font-size="10">Atornillar desde la base con tornillos confirmat 5×50.</text>
    <text x="350" y="280" text-anchor="middle" fill="#64748b" font-size="9">Verificar escuadra (90°) en ambos lados.</text>
  </g>

  <line x1="450" y1="1010" x2="450" y2="1040" stroke="#f59e0b" stroke-width="2" marker-end="url(#a)"/>

  <!-- PASO 3: Fondo -->
  <g transform="translate(100, 1060)">
    <rect x="0" y="0" width="700" height="420" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" fill="#f59e0b" font-size="14" font-weight="700">PASO 3: Instalar Fondo</text>
    <rect x="200" y="80" width="300" height="40" rx="3" fill="#C19A6B" stroke="white" stroke-width="2" opacity="0.3"/>
    <rect x="200" y="80" width="20" height="300" rx="3" fill="#C19A6B" stroke="white" stroke-width="2" opacity="0.3"/>
    <rect x="480" y="80" width="20" height="300" rx="3" fill="#C19A6B" stroke="white" stroke-width="2" opacity="0.3"/>
    <rect x="220" y="100" width="260" height="260" rx="3" fill="#F2F2F2" stroke="white" stroke-width="2"/>
    <text x="350" y="240" text-anchor="middle" fill="#64748b" font-size="11" font-weight="700">FONDO 450 × 2300</text>
    <text x="350" y="290" text-anchor="middle" fill="#94a3b8" font-size="10">Encajar en ranuras o atornillar desde atrás.</text>
    <text x="350" y="310" text-anchor="middle" fill="#64748b" font-size="9">Usar grapas o clavos de acero 1.2×20.</text>
  </g>

  <line x1="450" y1="1490" x2="450" y2="1520" stroke="#f59e0b" stroke-width="2" marker-end="url(#a)"/>

  <!-- PASO 4: Repisas -->
  <g transform="translate(100, 1540)">
    <rect x="0" y="0" width="700" height="420" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" fill="#f59e0b" font-size="14" font-weight="700">PASO 4: Colocar Repisas</text>
    <rect x="200" y="80" width="300" height="40" rx="3" fill="#C19A6B" stroke="white" stroke-width="2" opacity="0.2"/>
    <rect x="200" y="80" width="20" height="300" rx="3" fill="#C19A6B" stroke="white" stroke-width="2" opacity="0.2"/>
    <rect x="480" y="80" width="20" height="300" rx="3" fill="#C19A6B" stroke="white" stroke-width="2" opacity="0.2"/>
    <rect x="220" y="100" width="260" height="260" rx="3" fill="#F2F2F2" stroke="white" stroke-width="2" opacity="0.3"/>
    <rect x="230" y="120" width="240" height="25" rx="3" fill="#D9C2A3" stroke="white" stroke-width="2"/>
    <rect x="230" y="320" width="240" height="25" rx="3" fill="#D9C2A3" stroke="white" stroke-width="2"/>
    <text x="350" y="240" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">REPISAS 390 × 380</text>
    <text x="350" y="290" text-anchor="middle" fill="#94a3b8" font-size="10">Sujetar con tacos de soporte o escuadras metálicas.</text>
  </g>

  <line x1="450" y1="1970" x2="450" y2="2000" stroke="#f59e0b" stroke-width="2" marker-end="url(#a)"/>

  <!-- PASO 5: Cajones -->
  <g transform="translate(100, 2020)">
    <rect x="0" y="0" width="700" height="420" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" fill="#f59e0b" font-size="14" font-weight="700">PASO 5: Insertar Cajones</text>
    <rect x="200" y="80" width="300" height="40" rx="3" fill="#C19A6B" stroke="white" stroke-width="2" opacity="0.15"/>
    <rect x="200" y="80" width="20" height="300" rx="3" fill="#C19A6B" stroke="white" stroke-width="2" opacity="0.15"/>
    <rect x="480" y="80" width="20" height="300" rx="3" fill="#C19A6B" stroke="white" stroke-width="2" opacity="0.15"/>
    <rect x="230" y="120" width="240" height="25" rx="3" fill="#D9C2A3" stroke="white" stroke-width="2" opacity="0.3"/>
    <rect x="230" y="320" width="240" height="25" rx="3" fill="#D9C2A3" stroke="white" stroke-width="2" opacity="0.3"/>
    <rect x="225" y="150" width="250" height="70" rx="3" fill="#8B5A2B" stroke="white" stroke-width="2"/>
    <rect x="225" y="240" width="250" height="70" rx="3" fill="#8B5A2B" stroke="white" stroke-width="2"/>
    <text x="350" y="195" text-anchor="middle" fill="#f1f5f9" font-size="10" font-weight="700">CAJÓN SUP</text>
    <text x="350" y="285" text-anchor="middle" fill="#f1f5f9" font-size="10" font-weight="700">CAJÓN INF</text>
    <text x="350" y="340" text-anchor="middle" fill="#94a3b8" font-size="10">Instalar guías telescópicas antes de insertar.</text>
  </g>

  <line x1="450" y1="2450" x2="450" y2="2480" stroke="#f59e0b" stroke-width="2" marker-end="url(#a)"/>

  <!-- PASO 6: Tapa -->
  <g transform="translate(100, 2500)">
    <rect x="0" y="0" width="700" height="420" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" fill="#f59e0b" font-size="14" font-weight="700">PASO 6: Colocar Tapa</text>
    <rect x="200" y="80" width="300" height="40" rx="3" fill="#C19A6B" stroke="white" stroke-width="2" opacity="0.1"/>
    <rect x="200" y="80" width="20" height="300" rx="3" fill="#C19A6B" stroke="white" stroke-width="2" opacity="0.1"/>
    <rect x="480" y="80" width="20" height="300" rx="3" fill="#C19A6B" stroke="white" stroke-width="2" opacity="0.1"/>
    <rect x="230" y="120" width="240" height="25" rx="3" fill="#D9C2A3" stroke="white" stroke-width="2" opacity="0.2"/>
    <rect x="230" y="320" width="240" height="25" rx="3" fill="#D9C2A3" stroke="white" stroke-width="2" opacity="0.2"/>
    <rect x="225" y="150" width="250" height="70" rx="3" fill="#8B5A2B" stroke="white" stroke-width="2" opacity="0.5"/>
    <rect x="225" y="240" width="250" height="70" rx="3" fill="#8B5A2B" stroke="white" stroke-width="2" opacity="0.5"/>
    <rect x="200" y="75" width="300" height="15" rx="3" fill="#C19A6B" stroke="white" stroke-width="2"/>
    <text x="350" y="85" text-anchor="middle" fill="#0f172a" font-size="9" font-weight="700">TAPA 450 × 550</text>
    <text x="350" y="370" text-anchor="middle" fill="#94a3b8" font-size="10">Atornillar desde arriba. Verificar alineación con laterales.</text>
    <text x="350" y="390" text-anchor="middle" fill="#10b981" font-size="11" font-weight="700">✓ ENSAMBLAJE COMPLETO</text>
  </g>

  <!-- Checklist final -->
  <g transform="translate(100, 2960)">
    <rect x="0" y="0" width="700" height="200" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="350" y="30" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">CHECKLIST DE VERIFICACIÓN</text>
    <text x="30" y="60" fill="#10b981" font-size="11">✓ Escuadra de laterales (90°)</text>
    <text x="30" y="80" fill="#10b981" font-size="11">✓ Nivel de base y tapa</text>
    <text x="30" y="100" fill="#10b981" font-size="11">✓ Deslizamiento suave de cajones</text>
    <text x="30" y="120" fill="#10b981" font-size="11">✓ Todos los cantos aplicados</text>
    <text x="30" y="140" fill="#10b981" font-size="11">✓ Tiradores firmes</text>
    <text x="30" y="160" fill="#10b981" font-size="11">✓ Limpieza y protección de superficies</text>
    <text x="350" y="185" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="700">Tiempo estimado: 4-6 horas | Herramientas: taladro, nivel, escuadra, pistola de grapas</text>
  </g>
</svg>