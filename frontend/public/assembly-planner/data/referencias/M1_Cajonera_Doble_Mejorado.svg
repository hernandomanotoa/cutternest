<svg viewBox="0 0 650 2600" xmlns="http://www.w3.org/2000/svg" style="background:#0f172a; width:100%; height:95vh; display:block;">
  <defs>
    <pattern id="grid50" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f59e0b"/>
    </marker>
    <style>
      .piece { transition: opacity 0.3s; }
      .piece:hover { opacity: 1 !important; filter: brightness(1.1); }
      .tooltip { opacity: 0; transition: opacity 0.2s; pointer-events: none; }
      g:hover .tooltip { opacity: 1; }
    </style>
  </defs>
  <rect width="650" height="2600" fill="url(#grid50)"/>

  <!-- Título -->
  <text x="325" y="40" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700" font-family="system-ui,sans-serif">MÓDULO 1 — Cajonera Doble</text>
  <text x="325" y="65" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif">450 × 2300 mm | Family: cabinet | Anti-pandeo: activo</text>

  <g transform="translate(100, 100)">
    <!-- FONDO -->
    <rect x="0" y="0" width="450" height="2300" fill="#F2F2F2" stroke="#334155" stroke-width="2" opacity="0.9"/>

    <!-- TAPA -->
    <rect x="0" y="0" width="450" height="15" rx="2" fill="#C19A6B" stroke="#1e293b" stroke-width="2" class="piece"/>
    <text x="225" y="11" text-anchor="middle" fill="#0f172a" font-size="9" font-weight="700">TAPA</text>

    <!-- BASE -->
    <rect x="0" y="2285" width="450" height="15" rx="2" fill="#C19A6B" stroke="#1e293b" stroke-width="2" class="piece"/>
    <text x="225" y="2296" text-anchor="middle" fill="#0f172a" font-size="9" font-weight="700">BASE</text>

    <!-- LATERALES -->
    <rect x="0" y="15" width="15" height="2270" rx="2" fill="#C19A6B" stroke="#1e293b" stroke-width="2" class="piece"/>
    <text x="7.5" y="1150" text-anchor="middle" fill="#0f172a" font-size="8" font-weight="700" writing-mode="tb">LAT IZQ</text>

    <rect x="435" y="15" width="15" height="2270" rx="2" fill="#C19A6B" stroke="#1e293b" stroke-width="2" class="piece"/>
    <text x="442.5" y="1150" text-anchor="middle" fill="#0f172a" font-size="8" font-weight="700" writing-mode="tb">LAT DER</text>

    <!-- REPISA SUPERIOR -->
    <rect x="30" y="300" width="390" height="25" rx="2" fill="#D9C2A3" stroke="#1e293b" stroke-width="2" class="piece"/>
    <text x="225" y="318" text-anchor="middle" fill="#0f172a" font-size="9" font-weight="700">REPISA SUPERIOR</text>

    <!-- REPISA INFERIOR -->
    <rect x="30" y="1975" width="390" height="25" rx="2" fill="#D9C2A3" stroke="#1e293b" stroke-width="2" class="piece"/>
    <text x="225" y="1993" text-anchor="middle" fill="#0f172a" font-size="9" font-weight="700">REPISA INFERIOR</text>

    <!-- DIVISORES ANTI-PANDEO (4 huecos) -->
    <!-- Hueco 0: Tapa → Repisa Sup -->
    <rect x="70" y="15" width="30" height="285" rx="2" fill="#C19A6B" stroke="#1e293b" stroke-width="1.5" opacity="0.85" class="piece"/>
    <rect x="350" y="15" width="30" height="285" rx="2" fill="#C19A6B" stroke="#1e293b" stroke-width="1.5" opacity="0.85" class="piece"/>

    <!-- Hueco 1: Repisa Sup → Cajón Sup -->
    <rect x="70" y="325" width="30" height="180" rx="2" fill="#D9C2A3" stroke="#1e293b" stroke-width="1.5" opacity="0.85" class="piece"/>
    <rect x="350" y="325" width="30" height="180" rx="2" fill="#D9C2A3" stroke="#1e293b" stroke-width="1.5" opacity="0.85" class="piece"/>

    <!-- Hueco 2: Cajón Sup → Repisa Inf -->
    <rect x="70" y="505" width="30" height="1470" rx="2" fill="#C19A6B" stroke="#1e293b" stroke-width="1.5" opacity="0.6" class="piece"/>
    <text x="85" y="750" text-anchor="middle" fill="#0f172a" font-size="7" writing-mode="tb">DIV</text>
    <rect x="350" y="505" width="30" height="1470" rx="2" fill="#C19A6B" stroke="#1e293b" stroke-width="1.5" opacity="0.6" class="piece"/>
    <text x="365" y="750" text-anchor="middle" fill="#0f172a" font-size="7" writing-mode="tb">DIV</text>

    <!-- Hueco 3: Repisa Inf → Base -->
    <rect x="70" y="2000" width="30" height="285" rx="2" fill="#D9C2A3" stroke="#1e293b" stroke-width="1.5" opacity="0.85" class="piece"/>
    <rect x="350" y="2000" width="30" height="285" rx="2" fill="#D9C2A3" stroke="#1e293b" stroke-width="1.5" opacity="0.85" class="piece"/>

    <!-- CAJÓN SUPERIOR -->
    <rect x="25" y="325" width="400" height="180" rx="3" fill="#8B5A2B" stroke="#1e293b" stroke-width="2" class="piece"/>
    <text x="225" y="420" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="700">CAJÓN SUPERIOR</text>
    <rect x="205" y="480" width="40" height="8" rx="2" fill="#A0A0A0" stroke="#1e293b" stroke-width="1"/>

    <!-- CAJÓN INFERIOR -->
    <rect x="25" y="1795" width="400" height="180" rx="3" fill="#8B5A2B" stroke="#1e293b" stroke-width="2" class="piece"/>
    <text x="225" y="1890" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="700">CAJÓN INFERIOR</text>
    <rect x="205" y="1950" width="40" height="8" rx="2" fill="#A0A0A0" stroke="#1e293b" stroke-width="1"/>

    <!-- TRAVESANO TRASERO (corregido: arriba, no cruza divisores) -->
    <rect x="40" y="55" width="370" height="40" rx="2" fill="#4ECDC4" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.5" class="piece"/>
    <text x="225" y="80" text-anchor="middle" fill="#0f172a" font-size="8" font-weight="700">TRAVESANO TRASERO</text>

    <!-- DIMENSIONES -->
    <line x1="0" y1="2330" x2="450" y2="2330" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)"/>
    <text x="225" y="2355" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="700">450 mm</text>

    <line x1="-25" y1="0" x2="-25" y2="2300" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)"/>
    <text x="-42" y="1150" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="700" writing-mode="tb">2300 mm</text>
  </g>

  <!-- LEYENDA DE ESTADOS -->
  <g transform="translate(480, 120)">
    <rect x="0" y="0" width="150" height="140" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="75" y="22" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="700">ESTADOS</text>
    <rect x="12" y="35" width="18" height="12" rx="2" fill="#C19A6B" stroke="white" stroke-width="1.5"/>
    <text x="36" y="45" fill="#10b981" font-size="10" font-weight="700">● Ensamblada</text>
    <rect x="12" y="55" width="18" height="12" rx="2" fill="#D9C2A3" stroke="#4ECDC4" stroke-width="2"/>
    <text x="36" y="65" fill="#4ECDC4" font-size="10" font-weight="700">● Paso actual</text>
    <rect x="12" y="75" width="18" height="12" rx="2" fill="#8B5A2B" opacity="0.4" stroke="white" stroke-width="1"/>
    <text x="36" y="85" fill="#94a3b8" font-size="10">○ Pendiente</text>
    <rect x="12" y="95" width="18" height="12" rx="2" fill="#4ECDC4" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
    <text x="36" y="105" fill="#94a3b8" font-size="9">Travesano</text>
    <text x="75" y="128" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="700">Anti-pandeo: 4 divs</text>
  </g>

  <!-- NOTA ANTI-PANDEO -->
  <g transform="translate(480, 280)">
    <rect x="0" y="0" width="150" height="100" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="75" y="20" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="700">⚠ ANTI-PANDEO</text>
    <text x="10" y="40" fill="#94a3b8" font-size="9">Estante 390mm:</text>
    <text x="10" y="55" fill="#94a3b8" font-size="9">límite seguro ≈800</text>
    <text x="10" y="72" fill="#10b981" font-size="9">✓ Sin soporte extra</text>
    <text x="10" y="88" fill="#94a3b8" font-size="8">Divisores: 30×400</text>
  </g>
</svg>