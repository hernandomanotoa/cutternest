<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" style="background:#0f172a; width:100%; height:95vh; display:block;">
  <defs>
    <pattern id="g50t" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0L0 0 0 50" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="art" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="900" height="700" fill="url(#g50t)"/>

  <text x="450" y="35" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700" font-family="system-ui,sans-serif">MÓDULO 3 — Mesa de Centro</text>
  <text x="450" y="58" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="system-ui,sans-serif">800 × 450 mm | Family: table | 4 patas + estante inferior</text>

  <g transform="translate(50, 80)">
    <!-- TABLERO -->
    <rect x="0" y="0" width="800" height="30" rx="3" fill="#8B5A2B" stroke="#1e293b" stroke-width="2"/>
    <text x="400" y="20" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="700">TABLERO 800×30</text>

    <!-- PATA IZQ FRONT -->
    <rect x="20" y="30" width="80" height="420" rx="3" fill="#C19A6B" stroke="#1e293b" stroke-width="2"/>
    <text x="60" y="250" text-anchor="middle" fill="#0f172a" font-size="9" font-weight="700" writing-mode="tb">PATA IZQ-F</text>

    <!-- PATA DER FRONT -->
    <rect x="700" y="30" width="80" height="420" rx="3" fill="#C19A6B" stroke="#1e293b" stroke-width="2"/>
    <text x="740" y="250" text-anchor="middle" fill="#0f172a" font-size="9" font-weight="700" writing-mode="tb">PATA DER-F</text>

    <!-- PATA IZQ BACK (más tenue, perspectiva) -->
    <rect x="20" y="30" width="80" height="420" rx="3" fill="#8B5A2B" stroke="#1e293b" stroke-width="2" opacity="0.6"/>
    <text x="60" y="350" text-anchor="middle" fill="#f1f5f9" font-size="8" writing-mode="tb">PATA IZQ-B</text>

    <!-- PATA DER BACK -->
    <rect x="700" y="30" width="80" height="420" rx="3" fill="#8B5A2B" stroke="#1e293b" stroke-width="2" opacity="0.6"/>
    <text x="740" y="350" text-anchor="middle" fill="#f1f5f9" font-size="8" writing-mode="tb">PATA DER-B</text>

    <!-- ESTANTE INFERIOR (anti-pandeo visual) -->
    <rect x="120" y="350" width="560" height="20" rx="2" fill="#D9C2A3" stroke="#1e293b" stroke-width="2"/>
    <text x="400" y="365" text-anchor="middle" fill="#0f172a" font-size="10" font-weight="700">ESTANTE INF 560×20</text>

    <!-- DIMENSIONES -->
    <line x1="0" y1="470" x2="800" y2="470" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#art)" marker-start="url(#art)"/>
    <text x="400" y="495" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="700">800 mm</text>

    <line x1="-20" y1="0" x2="-20" y2="450" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#art)" marker-start="url(#art)"/>
    <text x="-38" y="225" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="700" writing-mode="tb">450 mm</text>
  </g>

  <!-- LEYENDA -->
  <g transform="translate(720, 100)">
    <rect x="0" y="0" width="160" height="140" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="80" y="22" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="700">ESTADOS</text>
    <rect x="12" y="35" width="18" height="12" rx="2" fill="#8B5A2B" stroke="white" stroke-width="1.5"/>
    <text x="36" y="45" fill="#10b981" font-size="10" font-weight="700">● Ensamblada</text>
    <rect x="12" y="55" width="18" height="12" rx="2" fill="#C19A6B" stroke="#4ECDC4" stroke-width="2"/>
    <text x="36" y="65" fill="#4ECDC4" font-size="10" font-weight="700">● Paso actual</text>
    <rect x="12" y="75" width="18" height="12" rx="2" fill="#D9C2A3" opacity="0.5" stroke="white" stroke-width="1"/>
    <text x="36" y="85" fill="#94a3b8" font-size="10">○ Pendiente</text>
    <text x="80" y="110" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="700">Family: table</text>
    <text x="80" y="128" text-anchor="middle" fill="#94a3b8" font-size="8">Sin anti-pandeo</text>
  </g>
</svg>