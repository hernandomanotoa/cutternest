<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CutterNest Assembly Planner</title>
  <link rel="stylesheet" href="./styles/theme.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="app-brand">
        <span class="app-brand__logo" aria-hidden="true">▦</span>
        <h1>CutterNest <span>Assembly Planner</span></h1>
        <span class="app-status" id="app-status" title="Estado del proyecto">Listo</span>
      </div>
      <div class="header-actions">
        <div class="form-group m-0" style="min-width: 180px;">
          <select id="module-selector" class="w-full">
            <option value="global">Global / Estructura</option>
          </select>
        </div>
        <div class="form-group m-0" style="min-width: 260px;">
          <input type="search" id="example-filter" placeholder="🔍 Buscar mueble…" aria-label="Buscar mueble del catálogo" style="margin-bottom:0.25rem;" />
          <select id="example-selector" class="w-full">
            <option value="" disabled selected>Seleccionar mueble...</option>
            <optgroup label="Personal">
              <option value="./data/ejemplo-closet-abierto-modular.csv">🧥 Clóset abierto modular 3.4 m</option>
              <option value="./data/ejemplo-closet-zapatera-mixta.csv">👟 Zapatera de clóset por calzado</option>
              <option value="./data/ejemplo-cajonera-alturas-mixtas.csv">👕 Cajonera frentes mixtos</option>
            </optgroup>
            <optgroup label="Salón">
              <option value="./data/ejemplo-mueble-tv.csv">📺 Mueble de TV</option>
              <option value="./data/ejemplo-mueble-tv-zocalo-cajon.csv">📺 Mueble TV con zócalo-cajón</option>
              <option value="./data/ejemplo-estanteria.csv">📚 Estantería</option>
              <option value="./data/ejemplo-aparador.csv">🍷 Aparador / buffet</option>
              <option value="./data/ejemplo-bufetero.csv">🍷 Bufetero</option>
              <option value="./data/ejemplo-vitrina.csv">🪟 Vitrina</option>
              <option value="./data/ejemplo-panel-tv.csv">🖥️ Panel para TV</option>
            </optgroup>
            <optgroup label="Comedor">
              <option value="./data/ejemplo-mesa-extensible.csv">🍽️ Mesa extensible (soporte)</option>
              <option value="./data/ejemplo-banco-comedor.csv">🪑 Banco de comedor</option>
            </optgroup>
            <optgroup label="Dormitorio">
              <option value="./data/ejemplo-armario.csv">🚪 Armario modular</option>
              <option value="./data/ejemplo-base-cama-cajones.csv">🛏️ Base de cama con cajones</option>
              <option value="./data/ejemplo-comoda.csv">👕 Cómoda / chifonier</option>
              <option value="./data/ejemplo-comoda-zocalo-cajon.csv">👕 Cómoda con zócalo-cajón</option>
              <option value="./data/ejemplo-comoda-baja.csv">👕 Cómoda baja con patas</option>
              <option value="./data/ejemplo-buro-3-cajones.csv">🌙 Buró 3 cajones</option>
              <option value="./data/ejemplo-buro-flotante.csv">🌙 Buró flotante</option>
              <option value="./data/ejemplo-mesa-noche.csv">🌙 Mesita de noche</option>
              <option value="./data/ejemplo-tocador.csv">🪞 Tocador con espejo</option>
              <option value="./data/ejemplo-tocador-espejo.csv">🪞 Tocador con alzada de espejo</option>
            </optgroup>
            <optgroup label="Vestidor">
              <option value="./data/ejemplo-cajonera-correderas-ocultas.csv">🗄️ Cajonera correderas ocultas</option>
              <option value="./data/ejemplo-closet-zocalo-cajon.csv">🧥 Clóset con zócalo-cajón</option>
              <option value="./data/ejemplo-closet-interior.csv">🧥 Clóset interior abierto</option>
            </optgroup>
            <optgroup label="Cocina">
              <option value="./data/ejemplo-cocina.csv">🍳 Cocina modular</option>
              <option value="./data/ejemplo-botellero.csv">🍾 Botellero</option>
              <option value="./data/ejemplo-isla-cocina.csv">🏝️ Isla</option>
              <option value="./data/ejemplo-columna-cocina.csv">🔥 Columna horno/micro</option>
            </optgroup>
            <optgroup label="Estudio">
              <option value="./data/ejemplo-escritorio.csv">🖥️ Escritorio modular</option>
              <option value="./data/ejemplo-archivador.csv">🗄️ Archivador</option>
              <option value="./data/ejemplo-estacion-trabajo.csv">🖥️ Estación de trabajo</option>
              <option value="./data/ejemplo-recepcion.csv">🛎️ Recepción / mostrador</option>
              <option value="./data/ejemplo-estanteria-oficina.csv">📚 Estantería de oficina</option>
            </optgroup>
            <optgroup label="Recibidor">
              <option value="./data/ejemplo-recibidor-lineal.csv">🚪 Recibidor lineal</option>
              <option value="./data/ejemplo-consola.csv">🛋️ Consola</option>
              <option value="./data/ejemplo-separador-ambientes.csv">↔️ Separador de ambientes</option>
            </optgroup>
            <optgroup label="Baño">
              <option value="./data/ejemplo-vanitory.csv">🚿 Mueble de lavabo</option>
              <option value="./data/ejemplo-columna-auxiliar-bano.csv">🧴 Columna auxiliar</option>
              <option value="./data/ejemplo-espejo-modulo.csv">🪞 Espejo con módulo</option>
            </optgroup>
            <optgroup label="Zapateras">
              <option value="./data/ejemplo-zapatero-compartimentos.csv">👟 Zapatero compartimentos</option>
              <option value="./data/ejemplo-zapatero-volquete.csv">👟 Zapatera volquete (abatible)</option>
              <option value="./data/ejemplo-zapatero-extraible.csv">🧥 Módulo extraíble para clóset</option>
              <option value="./data/ejemplo-zapatera-repisa.csv">👟 Zapatera repisa con riel</option>
              <option value="./data/ejemplo-zapatero-banco.csv">🪑 Banco zapatero</option>
            </optgroup>
          </select>
        </div>
        <button id="btn-load-example" class="btn btn--secondary">Cargar</button>
        <label class="btn btn--primary" for="file-input">Importar CSV</label>
        <input id="file-input" type="file" accept=".csv" hidden />
        <button id="btn-export-csv" class="btn btn--secondary">Exportar CSV</button>
        <button id="btn-save-example" class="btn btn--secondary">💾 Guardar como ejemplo</button>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="Vistas">
      <button id="tab-csv" class="tab tab--active" data-view="csv" role="tab" aria-selected="true" aria-controls="view-container" tabindex="0">CSV</button>
      <button id="tab-constructor" class="tab" data-view="constructor" role="tab" aria-selected="false" aria-controls="view-container" tabindex="-1">🔧 Constructor</button>
      <button id="tab-estructural" class="tab" data-view="estructural" role="tab" aria-selected="false" aria-controls="view-container" tabindex="-1">Estructural</button>
      <button id="tab-auditoria" class="tab" data-view="auditoria" role="tab" aria-selected="false" aria-controls="view-container" tabindex="-1">📋 Auditoría</button>
      <button id="tab-isometric" class="tab" data-view="isometric" role="tab" aria-selected="false" aria-controls="view-container" tabindex="-1">🧊 Isométrica</button>
      <button id="tab-renderer3d" class="tab" data-view="renderer3d" role="tab" aria-selected="false" aria-controls="view-container" tabindex="-1">🧊 3D</button>
    </nav>

    <main class="main-layout">
      <section id="view-container" class="view-container" role="tabpanel" aria-labelledby="tab-csv" tabindex="0"></section>

      <aside class="summary-panel" id="summary-panel">
        <div class="summary-panel__bar">
          <div class="summary-tabs" role="tablist" aria-label="Resumen del proyecto">
            <button class="summary-tab is-active" data-summary-tab="resumen" role="tab" aria-selected="true">Resumen</button>
            <button class="summary-tab" data-summary-tab="piezas" role="tab" aria-selected="false">Piezas</button>
            <button class="summary-tab" data-summary-tab="materiales" role="tab" aria-selected="false">Materiales</button>
            <button class="summary-tab" data-summary-tab="herrajes" role="tab" aria-selected="false">Herrajes</button>
            <button class="summary-tab" data-summary-tab="alertas" role="tab" aria-selected="false">Alertas</button>
          </div>
          <button class="summary-collapse" id="summary-collapse" title="Contraer panel" aria-label="Contraer panel">⇥</button>
        </div>
        <div class="summary-panel__body">
          <div data-summary-pane="resumen">
            <div class="summary-grid">
              <div class="summary-card">
                <span class="summary-label">Módulo</span>
                <span id="summary-module" class="summary-value">Global</span>
              </div>
              <div class="summary-card">
                <span class="summary-label">Piezas</span>
                <span id="summary-pieces" class="summary-value">0</span>
              </div>
              <div class="summary-card">
                <span class="summary-label">Pasos</span>
                <span id="summary-steps" class="summary-value">0</span>
              </div>
              <div class="summary-card">
                <span class="summary-label">Alertas</span>
                <span id="summary-alerts" class="summary-value">0</span>
              </div>
            </div>
          </div>
          <div data-summary-pane="piezas" hidden>
            <div id="pieces-list" class="summary-list">
              <p class="empty-state">Sin piezas todavía.</p>
            </div>
          </div>
          <div data-summary-pane="materiales" hidden>
            <div id="materials-list" class="summary-list">
              <p class="empty-state">Sin piezas todavía.</p>
            </div>
          </div>
          <div data-summary-pane="herrajes" hidden>
            <div id="hardware-list" class="hardware-list">
              <p class="empty-state">Importa un CSV para ver la lista.</p>
            </div>
          </div>
          <div data-summary-pane="alertas" hidden>
            <div id="alerts-list" class="summary-list">
              <p class="empty-state">Sin alertas. Todo listo.</p>
            </div>
          </div>
        </div>
      </aside>
    </main>

    <footer class="app-footer">
      <span id="status-message">Listo. Importa un CSV para comenzar.</span>
    </footer>
  </div>

  <script>
  // Chrome de la app (sin lógica de negocio): pestañas y contracción del
  // panel derecho (persistido) y espejo del estado en la barra superior.
  (function () {
    var panel = document.getElementById('summary-panel');
    var collapseBtn = document.getElementById('summary-collapse');
    try {
      if (localStorage.getItem('cn-summary-collapsed') === '1') panel.classList.add('is-collapsed');
    } catch (e) { /* sin storage */ }
    collapseBtn.addEventListener('click', function () {
      var collapsed = panel.classList.toggle('is-collapsed');
      collapseBtn.textContent = collapsed ? '⇤' : '⇥';
      try { localStorage.setItem('cn-summary-collapsed', collapsed ? '1' : '0'); } catch (e) { /* sin storage */ }
    });
    if (panel.classList.contains('is-collapsed')) collapseBtn.textContent = '⇤';

    var tabs = panel.querySelectorAll('[data-summary-tab]');
    tabs.forEach(function (tab) {
      tab.addEventListener('click', function () {
        tabs.forEach(function (t) {
          t.classList.toggle('is-active', t === tab);
          t.setAttribute('aria-selected', t === tab ? 'true' : 'false');
        });
        panel.querySelectorAll('[data-summary-pane]').forEach(function (pane) {
          pane.hidden = pane.dataset.summaryPane !== tab.dataset.summaryTab;
        });
        try { localStorage.setItem('cn-summary-tab', tab.dataset.summaryTab); } catch (e) { /* sin storage */ }
      });
    });
    try {
      var tabSaved = localStorage.getItem('cn-summary-tab');
      if (tabSaved) panel.querySelector('[data-summary-tab="' + tabSaved + '"]')?.click();
    } catch (e) { /* sin storage */ }

    // Espejo del estado (footer → barra superior).
    var statusEl = document.getElementById('status-message');
    var appStatus = document.getElementById('app-status');
    if (statusEl && appStatus && window.MutationObserver) {
      var sync = function () { appStatus.textContent = statusEl.textContent; };
      new MutationObserver(sync).observe(statusEl, { childList: true, characterData: true, subtree: true });
      sync();
    }
  })();
  </script>
  <script src="./vendor/jspdf.umd.min.js"></script>
  <script src="./vendor/html2canvas.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
