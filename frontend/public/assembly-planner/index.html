<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CutterNest Assembly Planner</title>
  <link rel="stylesheet" href="./styles/theme.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1>CutterNest <span>Assembly Planner</span></h1>
      <div class="header-actions">
        <div class="form-group m-0" style="min-width: 180px;">
          <select id="module-selector" class="w-full">
            <option value="global">Global / Estructura</option>
          </select>
        </div>
        <div class="form-group m-0" style="min-width: 260px;">
          <select id="example-selector" class="w-full">
            <option value="" disabled selected>Seleccionar mueble...</option>
            <option value="./data/ejemplo-universal.csv">🆕 Universal v3 — 6 muebles (Cajonera, Librero, Mesa, Silla, Ropero, Zapatero)</option>
            <option value="./data/ejemplo-basico.csv">📚 Estantería básica</option>
            <option value="./data/ejemplo-librero-alto.csv">📚 Librero alto con soportes</option>
            <option value="./data/ejemplo-cajonera.csv">🗄️ Clóset / Cajoneras (4 módulos)</option>
            <option value="./data/ejemplo-cajones-verticales.csv">🗄️ Cajones verticales + repisas</option>
            <option value="./data/ejemplo-comoda.csv">🗄️ Cómoda / Chifonier (5 cajones)</option>
            <option value="./data/ejemplo-cocina.csv">🍳 Cocina modular</option>
            <option value="./data/ejemplo-vanitory.csv">🚿 Vanitory</option>
            <option value="./data/ejemplo-mueble-tv.csv">📺 Mueble de TV</option>
            <option value="./data/ejemplo-escritorio.csv">🖥️ Escritorio</option>
            <option value="./data/ejemplo-armario.csv">🚪 Armario con puertas corredizas</option>
            <option value="./data/ejemplo-global.csv">🏗️ Con estructura global y submódulo</option>
          </select>
        </div>
        <button id="btn-load-example" class="btn btn--secondary">Cargar</button>
        <label class="btn btn--primary" for="file-input">Importar CSV</label>
        <input id="file-input" type="file" accept=".csv" hidden />
        <button id="btn-export-csv" class="btn btn--secondary">Exportar CSV</button>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="Vistas">
      <button class="tab tab--active" data-view="csv" role="tab" aria-selected="true">CSV</button>
      <button class="tab" data-view="estructural" role="tab">Estructural</button>
      <button class="tab" data-view="grafo" role="tab">Grafo</button>
      <button class="tab" data-view="ensamblaje" role="tab">Ensamblaje</button>
      <button class="tab" data-view="manual" role="tab">Manual</button>
    </nav>

    <main class="main-layout">
      <section id="view-container" class="view-container"></section>

      <aside class="summary-panel">
        <h2>Resumen</h2>
        <div class="summary-grid">
          <div class="summary-card">
            <span class="summary-label">Módulo</span>
            <span id="summary-module" class="summary-value">Global</span>
          </div>
          <div class="summary-card">
            <span class="summary-label">Piezas</span>
            <span id="summary-pieces" class="summary-value">0</span>
          </div>
          <div class="summary-card">
            <span class="summary-label">Pasos</span>
            <span id="summary-steps" class="summary-value">0</span>
          </div>
          <div class="summary-card">
            <span class="summary-label">Alertas</span>
            <span id="summary-alerts" class="summary-value">0</span>
          </div>
        </div>

        <h3>Herrajes / Insumos</h3>
        <div id="hardware-list" class="hardware-list">
          <p class="empty-state">Importa un CSV para ver la lista.</p>
        </div>
      </aside>
    </main>

    <footer class="app-footer">
      <span id="status-message">Listo. Importa un CSV para comenzar.</span>
    </footer>
  </div>

  <script src="./vendor/jspdf.umd.min.js"></script>
  <script src="./vendor/html2canvas.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
