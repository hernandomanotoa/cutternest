<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CutterNest Assembly Planner</title>
  <link rel="stylesheet" href="./styles/theme.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1>CutterNest <span>Assembly Planner</span></h1>
      <div class="header-actions">
        <div class="form-group m-0" style="min-width: 180px;">
          <select id="module-selector" class="w-full">
            <option value="global">Global / Estructura</option>
          </select>
        </div>
        <div class="form-group m-0" style="min-width: 260px;">
          <select id="example-selector" class="w-full">
            <option value="" disabled selected>Seleccionar mueble...</option>
            <optgroup label="Salón">
              <option value="./data/ejemplo-mueble-tv.csv">📺 Mueble de TV</option>
              <option value="./data/ejemplo-estanteria.csv">📚 Estantería</option>
              <option value="./data/ejemplo-aparador.csv">🍷 Aparador / buffet</option>
              <option value="./data/ejemplo-vitrina.csv">🪟 Vitrina</option>
              <option value="./data/ejemplo-librero-alto.csv">📖 Librero alto</option>
            </optgroup>
            <optgroup label="Comedor">
              <option value="./data/ejemplo-aparador.csv">🍷 Aparador buffet</option>
              <option value="./data/ejemplo-vitrina.csv">🪟 Vitrina</option>
              <option value="./data/ejemplo-mesa-extensible.csv">🍽️ Mesa extensible (soporte)</option>
            </optgroup>
            <optgroup label="Dormitorio">
              <option value="./data/ejemplo-armario.csv">🚪 Armario modular</option>
              <option value="./data/ejemplo-comoda.csv">👕 Cómoda / chifonier</option>
              <option value="./data/ejemplo-mesa-noche.csv">🌙 Mesita de noche</option>
              <option value="./data/ejemplo-cabecero.csv">🛏️ Cabecero con mesitas</option>
              <option value="./data/ejemplo-zapatero-compartimentos.csv">👟 Zapatero</option>
            </optgroup>
            <optgroup label="Vestidor">
              <option value="./data/ejemplo-closet-modular-abierto.csv">🧥 Sistema armario abierto</option>
              <option value="./data/ejemplo-zapatero-compartimentos.csv">👟 Zapatero</option>
              <option value="./data/ejemplo-cajonera.csv">🗄️ Cajoneras modulares</option>
            </optgroup>
            <optgroup label="Cocina">
              <option value="./data/ejemplo-cocina.csv">🍳 Cocina modular</option>
              <option value="./data/ejemplo-botellero.csv">🍾 Botellero</option>
              <option value="./data/ejemplo-isla-cocina.csv">🏝️ Isla</option>
              <option value="./data/ejemplo-columna-cocina.csv">🔥 Columna horno/micro</option>
            </optgroup>
            <optgroup label="Estudio">
              <option value="./data/ejemplo-escritorio.csv">🖥️ Escritorio modular</option>
              <option value="./data/ejemplo-librero-alto.csv">📖 Librería</option>
              <option value="./data/ejemplo-archivador.csv">🗄️ Archivador</option>
              <option value="./data/ejemplo-estanteria.csv">📚 Estantería</option>
            </optgroup>
            <optgroup label="Recibidor">
              <option value="./data/ejemplo-recibidor-lineal.csv">🚪 Recibidor lineal</option>
              <option value="./data/ejemplo-consola.csv">🛋️ Consola</option>
              <option value="./data/ejemplo-separador-ambientes.csv">↔️ Separador de ambientes</option>
            </optgroup>
            <optgroup label="Baño">
              <option value="./data/ejemplo-vanitory.csv">🚿 Mueble de lavabo</option>
              <option value="./data/ejemplo-columna-auxiliar-bano.csv">🧴 Columna auxiliar</option>
              <option value="./data/ejemplo-espejo-modulo.csv">🪞 Espejo con módulo</option>
            </optgroup>
            <optgroup label="Universales">
              <option value="./data/ejemplo-universal-cajonera.csv">🗄️ Cajonera</option>
              <option value="./data/ejemplo-universal-librero.csv">📖 Librero</option>
              <option value="./data/ejemplo-universal-ropero.csv">🚪 Ropero</option>
              <option value="./data/ejemplo-universal-zapatero.csv">👟 Zapatero</option>
            </optgroup>
            <optgroup label="Básicos">
              <option value="./data/ejemplo-basico.csv">📄 Básico</option>
              <option value="./data/ejemplo-global.csv">🌍 Global</option>
            </optgroup>
            <optgroup label="Fondo (montaje)">
              <option value="./data/ejemplo-fondo-externo.csv">📦 Fondo externo</option>
              <option value="./data/ejemplo-fondo-interno.csv">📦 Fondo interno</option>
              <option value="./data/ejemplo-fondo-custom.csv">📦 Fondo custom</option>
            </optgroup>
          </select>
        </div>
        <button id="btn-load-example" class="btn btn--secondary">Cargar</button>
        <label class="btn btn--primary" for="file-input">Importar CSV</label>
        <input id="file-input" type="file" accept=".csv" hidden />
        <button id="btn-export-csv" class="btn btn--secondary">Exportar CSV</button>
        <button id="btn-save-example" class="btn btn--secondary">💾 Guardar como ejemplo</button>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="Vistas">
      <button class="tab tab--active" data-view="csv" role="tab" aria-selected="true">CSV</button>
      <button class="tab" data-view="estructural" role="tab">Estructural</button>
      <button class="tab" data-view="isometric" role="tab">🧊 Isométrica</button>
    </nav>

    <main class="main-layout">
      <section id="view-container" class="view-container"></section>

      <aside class="summary-panel">
        <h2>Resumen</h2>
        <div class="summary-grid">
          <div class="summary-card">
            <span class="summary-label">Módulo</span>
            <span id="summary-module" class="summary-value">Global</span>
          </div>
          <div class="summary-card">
            <span class="summary-label">Piezas</span>
            <span id="summary-pieces" class="summary-value">0</span>
          </div>
          <div class="summary-card">
            <span class="summary-label">Pasos</span>
            <span id="summary-steps" class="summary-value">0</span>
          </div>
          <div class="summary-card">
            <span class="summary-label">Alertas</span>
            <span id="summary-alerts" class="summary-value">0</span>
          </div>
        </div>

        <h3>Herrajes / Insumos</h3>
        <div id="hardware-list" class="hardware-list">
          <p class="empty-state">Importa un CSV para ver la lista.</p>
        </div>
      </aside>
    </main>

    <footer class="app-footer">
      <span id="status-message">Listo. Importa un CSV para comenzar.</span>
    </footer>
  </div>

  <script src="./vendor/jspdf.umd.min.js"></script>
  <script src="./vendor/html2canvas.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
